name: Релиз

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Определить версию
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Собрать пакет
        shell: pwsh
        run: ./scripts/package.ps1 -Version "${{ steps.version.outputs.value }}"

      - name: Создать GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/SysDiff-${{ steps.version.outputs.value }}-win-x64.zip
            artifacts/SysDiff-${{ steps.version.outputs.value }}-win-x64.zip.sha256
