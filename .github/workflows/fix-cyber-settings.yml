name: Fix Cyber Console settings

on:
  push:
    branches: [agent/sysdiff-v0.5.0]
    paths: [.github/workflows/fix-cyber-settings.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sysdiff-v0.5.0
          fetch-depth: 0

      - name: Исправить Settings и удалить workflow
        shell: pwsh
        run: |
          $path = 'src/SysDiff.Cli/Terminal/TerminalControlCenter.cs'
          $content = Get-Content $path -Raw
          $content = $content.Replace('закрыть Terminal Control Center', 'закрыть Cyber Control Node')
          $content = $content.Replace('TerminalCapabilities.GetSafeWindowWidth() >= 92', 'TerminalCapabilities.GetSafeWindowWidth() >= 96')
          $bad = '1–9 — открыть модуль напрямую`nP/B/A — Snapshot Node`nC — Diff Lab`nW — Watch Operations`nL — Live Signal`nD — Node Diagnostics`nF5 — обновить Control Node'
          $good = '1–9 — открыть модуль напрямую{Environment.NewLine}P/B/A — Snapshot Node{Environment.NewLine}C — Diff Lab{Environment.NewLine}W — Watch Operations{Environment.NewLine}L — Live Signal{Environment.NewLine}D — Node Diagnostics{Environment.NewLine}F5 — обновить Control Node'
          $content = $content.Replace($bad, $good)
          Set-Content $path $content -Encoding utf8NoBOM
          Remove-Item '.github/workflows/fix-cyber-settings.yml'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $path .github/workflows/fix-cyber-settings.yml
          git commit -m 'Исправить Settings Cyber Console'
          git push origin HEAD:agent/sysdiff-v0.5.0
