name: Patch Cyber Console labels

on:
  push:
    branches: [agent/sysdiff-v0.5.0]
    paths: [.github/workflows/patch-cyber-labels.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Получить release-ветку
        uses: actions/checkout@v4
        with:
          ref: agent/sysdiff-v0.5.0
          fetch-depth: 0

      - name: Обновить подписи и удалить временный workflow
        shell: pwsh
        run: |
          $path = 'src/SysDiff.Cli/Terminal/TerminalControlCenter.cs'
          $content = Get-Content $path -Raw
          $replacements = [ordered]@{
            '"Snapshot Center"' = '"Snapshot Node"'
            '"Comparison Lab"' = '"Diff Lab"'
            '"Watch Session"' = '"Watch Operations"'
            '"Live Monitor"' = '"Live Signal"'
            '"Reports & Bundles"' = '"Report Vault"'
            '"Diagnostics"' = '"Node Diagnostics"'
            '"Settings"' = '"System Settings"'
            '"About SysDiff"' = '"About Node"'
            '"Exit"' = '"Disconnect"'
            'ABOUT SYSDIFF 0.4.0' = 'ABOUT SYSDIFF 0.5.0'
            'Terminal Control Center является основным интерактивным интерфейсом' = 'Cyber Console является основным интерактивным интерфейсом'
            'SETTINGS & HOTKEYS' = 'SYSTEM SETTINGS // COMMAND DECK'
            'F5 — обновить dashboard' = '1–9 — открыть модуль напрямую`nP/B/A — Snapshot Node`nC — Diff Lab`nW — Watch Operations`nL — Live Signal`nD — Node Diagnostics`nF5 — обновить Control Node'
          }
          foreach ($entry in $replacements.GetEnumerator()) {
            $content = $content.Replace($entry.Key, $entry.Value)
          }
          Set-Content $path $content -Encoding utf8NoBOM
          Remove-Item '.github/workflows/patch-cyber-labels.yml'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $path .github/workflows/patch-cyber-labels.yml
          git commit -m 'Обновить подписи Cyber Console'
          git push origin HEAD:agent/sysdiff-v0.5.0
