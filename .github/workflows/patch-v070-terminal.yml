name: Patch Release Channel 0.7

on:
  pull_request:
    types: [opened]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/sysdiff-v0.7.0'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sysdiff-v0.7.0
          fetch-depth: 0

      - name: Подключить Update Center к Cyber Console
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          control_path = Path('src/SysDiff.Cli/Terminal/TerminalControlCenter.cs')
          control = control_path.read_text(encoding='utf-8')

          replacements = [
              (
                  'new("system", "System Node", "diagnostics, settings, about, disconnect", "⚙")',
                  'new("system", "System Node", "updates, diagnostics, settings and disconnect", "⚙")'
              ),
              (
                  '    private readonly DriftOperationsService _driftOperations;\n    private readonly SnapshotCoordinator _coordinator;',
                  '    private readonly DriftOperationsService _driftOperations;\n    private readonly UpdateService _updateService;\n    private readonly UpdateSettingsStore _updateSettingsStore;\n    private readonly UpdateInstaller _updateInstaller;\n    private readonly SnapshotCoordinator _coordinator;'
              ),
              (
                  '        DriftOperationsService driftOperations,\n        SnapshotCoordinator coordinator,',
                  '        DriftOperationsService driftOperations,\n        UpdateService updateService,\n        UpdateSettingsStore updateSettingsStore,\n        UpdateInstaller updateInstaller,\n        SnapshotCoordinator coordinator,'
              ),
              (
                  '        _driftOperations = driftOperations;\n        _coordinator = coordinator;',
                  '        _driftOperations = driftOperations;\n        _updateService = updateService;\n        _updateSettingsStore = updateSettingsStore;\n        _updateInstaller = updateInstaller;\n        _coordinator = coordinator;'
              )
          ]
          for old, new in replacements:
              if old not in control:
                  raise SystemExit(f'Missing TerminalControlCenter marker: {old[:80]}')
              control = control.replace(old, new, 1)

          settings_pattern = re.compile(
              r'    private void RunSettings\(\)\n    \{.*?\n    \}\n\n    private void RunAbout\(\)',
              re.S)
          settings_replacement = '''    private void RunSettings()
    {
        _renderer.ShowMessage(
            "SYSTEM SETTINGS // COMMAND DECK",
            $"Режим хранения: {(_paths.Portable ? "portable" : "user profile")}{Environment.NewLine}Данные: {_paths.DataDirectory}{Environment.NewLine}SQLite: {_paths.DatabasePath}{Environment.NewLine}Отчёты: {_paths.ReportsDirectory}{Environment.NewLine}Логи: {_paths.LogsDirectory}{Environment.NewLine}Updates: {_paths.UpdatesDirectory}{Environment.NewLine}{Environment.NewLine}Горячие клавиши:{Environment.NewLine}↑/↓ — навигация{Environment.NewLine}Enter — открыть{Environment.NewLine}Esc — назад{Environment.NewLine}/ — поиск изменений{Environment.NewLine}F — severity filter{Environment.NewLine}S — сортировка{Environment.NewLine}R — raw changes{Environment.NewLine}E — экспорт{Environment.NewLine}1–9 — открыть модуль напрямую{Environment.NewLine}P/B/A — Snapshot Node{Environment.NewLine}C — Diff Lab{Environment.NewLine}G — Drift Operations{Environment.NewLine}T — Timeline{Environment.NewLine}K — Case Vault{Environment.NewLine}W — Watch Operations{Environment.NewLine}L — Live Signal{Environment.NewLine}D — System Node{Environment.NewLine}F5 — обновить Control Node{Environment.NewLine}Q — выход");
    }

    private void RunAbout()'''
          control, count = settings_pattern.subn(settings_replacement, control, count=1)
          if count != 1:
              raise SystemExit('RunSettings replacement failed')

          about_pattern = re.compile(
              r'    private void RunAbout\(\)\n    \{.*?\n    \}\n\n    private async Task<SnapshotRecord> CaptureWithProgressAsync',
              re.S)
          about_replacement = '''    private void RunAbout()
    {
        _renderer.ShowMessage(
            "ABOUT SYSDIFF 0.7.0",
            "SysDiff — локальная Windows-утилита для снимков, сравнения и расследования системных изменений. Release Channel 0.7 добавляет официальные теги, GitHub Releases, проверяемый manifest и безопасное обновление portable EXE.\\n\\nAuto-check не блокирует запуск. Auto-download только загружает и проверяет ZIP. Установка всегда требует подтверждения, создаёт backup и выполняет rollback при ошибке. Официальная сборка 0.7.0 пока не имеет Authenticode-подписи, поэтому manifest явно содержит unsigned=true.\\n\\nSysDiff не является антивирусом.\\n\\nАвтор: Onmaynec\\nЛицензия: MIT");
    }

    private async Task<SnapshotRecord> CaptureWithProgressAsync'''
          control, count = about_pattern.subn(about_replacement, control, count=1)
          if count != 1:
              raise SystemExit('RunAbout replacement failed')

          control = re.sub(
              r'Console\.Title = "SysDiff [^"]+ · Cyber Console";',
              'Console.Title = "SysDiff 0.7.0 · Release Channel";',
              control)
          control_path.write_text(control, encoding='utf-8')

          drift_path = Path('src/SysDiff.Cli/Terminal/TerminalControlCenter.Drift.cs')
          drift = drift_path.read_text(encoding='utf-8')
          marker = '''        [
            new("doctor", "Node Diagnostics", "Windows, SQLite, providers and terminal", "✓"),'''
          replacement = '''        [
            new("updates", "Update Center", "stable releases, download and safe install", "⇧"),
            new("doctor", "Node Diagnostics", "Windows, SQLite, providers and terminal", "✓"),'''
          if marker not in drift:
              raise SystemExit('System Node actions marker missing')
          drift = drift.replace(marker, replacement, 1)

          handler = '''        if (action.Id == "doctor")
        {
            await RunDiagnosticsAsync(cancellationToken);
        }'''
          handler_replacement = '''        if (action.Id == "updates")
        {
            return await RunUpdateCenterAsync(cancellationToken);
        }
        if (action.Id == "doctor")
        {
            await RunDiagnosticsAsync(cancellationToken);
        }'''
          if handler not in drift:
              raise SystemExit('System Node handler marker missing')
          drift = drift.replace(handler, handler_replacement, 1)
          drift_path.write_text(drift, encoding='utf-8')

          renderer_path = Path('src/SysDiff.Cli/Terminal/TerminalRenderer.cs')
          renderer = renderer_path.read_text(encoding='utf-8')
          renderer = re.sub(
              r'Console\.Title = "SysDiff [^"]+ · Cyber Console";',
              'Console.Title = "SysDiff 0.7.0 · Release Channel";',
              renderer)
          renderer_path.write_text(renderer, encoding='utf-8')

          service_path = Path('src/SysDiff.Cli/Updates/UpdateService.cs')
          service = service_path.read_text(encoding='utf-8')
          service = service.replace('using System.Net;\n', '')
          service = service.replace(
              '''            exception is HttpRequestException
            or IOException
            or ReleaseManifestException
            or InvalidDataException)''',
              '''            exception is HttpRequestException
            or IOException
            or InvalidDataException)''')
          service_path.write_text(service, encoding='utf-8')

          package_path = Path('scripts/package.ps1')
          package = package_path.read_text(encoding='utf-8')
          package = package.replace(
              "if ($Version -notmatch '^0|[1-9][0-9]*\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$')",
              "if ($Version -notmatch '^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$')")
          package_path.write_text(package, encoding='utf-8')
          PY

      - name: Зафиксировать итоговый patch и удалить workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-v070-terminal.yml
          git add src/SysDiff.Cli scripts/package.ps1
          git commit -m "Подключить Update Center к Cyber Console"
          git push origin HEAD:agent/sysdiff-v0.7.0
