name: Bootstrap project

on:
  push:
    branches:
      - agent/initial-sysdiff

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand project archive
        shell: bash
        run: |
          cat .bootstrap/parts/part-* > /tmp/project.tar.gz
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/project.tar.gz

      - name: Commit project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Создать SysDiff MVP" || exit 0
          git push

# Triggered via Contents API.
