name: Очистка слитых веток

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write

jobs:
  cleanup-legacy:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Удалить старые слитые ветки
        uses: actions/github-script@v7
        with:
          script: |
            const protectedBranches = new Set(['main', context.payload.pull_request.head.ref]);
            const candidates = ['agent/initial-sysdiff', 'agent/sysdiff-v0.2.0'];
            for (const branch of candidates) {
              if (protectedBranches.has(branch)) continue;
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branch}`
                });
                core.info(`Удалена ветка ${branch}`);
              } catch (error) {
                if (error.status === 404) {
                  core.info(`Ветка ${branch} уже отсутствует`);
                } else {
                  throw error;
                }
              }

  cleanup-head:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Удалить head-ветку после merge
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            if (branch === context.payload.repository.default_branch) {
              core.info('Основная ветка не удаляется.');
              return;
            }
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`
              });
              core.info(`Удалена ветка ${branch}`);
            } catch (error) {
              if (error.status === 404) {
                core.info(`Ветка ${branch} уже удалена`);
              } else {
                throw error;
              }
            }
