name: Patch Release Channel 0.7 Sync

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/sysdiff-v0.7.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sysdiff-v0.7.0
          fetch-depth: 0
      - name: Применить structural patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/SysDiff.Cli/Terminal/TerminalControlCenter.cs')
          s = p.read_text(encoding='utf-8')
          changes = [
            ('new("system", "System Node", "diagnostics, settings, about, disconnect", "⚙")',
             'new("system", "System Node", "updates, diagnostics, settings and disconnect", "⚙")'),
            ('    private readonly DriftOperationsService _driftOperations;\n    private readonly SnapshotCoordinator _coordinator;',
             '    private readonly DriftOperationsService _driftOperations;\n    private readonly UpdateService _updateService;\n    private readonly UpdateSettingsStore _updateSettingsStore;\n    private readonly UpdateInstaller _updateInstaller;\n    private readonly SnapshotCoordinator _coordinator;'),
            ('        DriftOperationsService driftOperations,\n        SnapshotCoordinator coordinator,',
             '        DriftOperationsService driftOperations,\n        UpdateService updateService,\n        UpdateSettingsStore updateSettingsStore,\n        UpdateInstaller updateInstaller,\n        SnapshotCoordinator coordinator,'),
            ('        _driftOperations = driftOperations;\n        _coordinator = coordinator;',
             '        _driftOperations = driftOperations;\n        _updateService = updateService;\n        _updateSettingsStore = updateSettingsStore;\n        _updateInstaller = updateInstaller;\n        _coordinator = coordinator;')
          ]
          for old, new in changes:
            if old not in s:
              raise SystemExit('missing marker: ' + old[:70])
            s = s.replace(old, new, 1)
          s = re.sub(r'"ABOUT SYSDIFF 0\.6\.0"', '"ABOUT SYSDIFF 0.7.0"', s)
          s = re.sub(r'Console\.Title = "SysDiff [^"]+ · Cyber Console";',
                     'Console.Title = "SysDiff 0.7.0 · Release Channel";', s)
          p.write_text(s, encoding='utf-8')

          p = Path('src/SysDiff.Cli/Terminal/TerminalControlCenter.Drift.cs')
          s = p.read_text(encoding='utf-8')
          old = '        [\n            new("doctor", "Node Diagnostics", "Windows, SQLite, providers and terminal", "✓"),'
          new = '        [\n            new("updates", "Update Center", "stable releases, download and safe install", "⇧"),\n            new("doctor", "Node Diagnostics", "Windows, SQLite, providers and terminal", "✓"),'
          if old not in s:
            raise SystemExit('missing System Node menu marker')
          s = s.replace(old, new, 1)
          old = '        if (action.Id == "doctor")\n        {\n            await RunDiagnosticsAsync(cancellationToken);\n        }'
          new = '        if (action.Id == "updates")\n        {\n            return await RunUpdateCenterAsync(cancellationToken);\n        }\n        if (action.Id == "doctor")\n        {\n            await RunDiagnosticsAsync(cancellationToken);\n        }'
          if old not in s:
            raise SystemExit('missing System Node handler marker')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('src/SysDiff.Cli/Terminal/TerminalRenderer.cs')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'Console\.Title = "SysDiff [^"]+ · Cyber Console";',
                     'Console.Title = "SysDiff 0.7.0 · Release Channel";', s)
          p.write_text(s, encoding='utf-8')

          p = Path('src/SysDiff.Cli/Updates/UpdateService.cs')
          s = p.read_text(encoding='utf-8').replace('using System.Net;\n', '')
          s = s.replace('            or ReleaseManifestException\n            or InvalidDataException)',
                        '            or InvalidDataException)')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Удалить временные workflows и отправить patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/patch-v070-terminal.yml .github/workflows/patch-v070-sync.yml
          git add src/SysDiff.Cli
          git commit -m "Подключить Update Center к System Node"
          git push origin HEAD:agent/sysdiff-v0.7.0
