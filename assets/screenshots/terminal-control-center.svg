<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">SysDiff 0.4.0 Terminal Control Center</title>
  <desc id="desc">Превью полноэкранной терминальной панели SysDiff с навигацией стрелками.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131d"/>
      <stop offset="1" stop-color="#0b1e2d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1280" height="760" rx="30" fill="#050b11"/>
  <rect x="38" y="38" width="1204" height="684" rx="18" fill="url(#bg)" stroke="#19c3df" stroke-width="2" filter="url(#shadow)"/>
  <g font-family="Consolas, 'Cascadia Mono', monospace">
    <text x="640" y="94" fill="#55e7ff" font-size="26" text-anchor="middle" font-weight="700">SYSDIFF CONTROL CENTER</text>
    <text x="640" y="124" fill="#2c9fb7" font-size="15" text-anchor="middle">WINDOWS INVESTIGATION CONSOLE · VERSION 0.4.0</text>
    <line x1="62" y1="148" x2="1218" y2="148" stroke="#1b8499"/>
    <line x1="520" y1="148" x2="520" y2="646" stroke="#1b8499"/>

    <text x="84" y="190" fill="#2c9fb7" font-size="15">NAVIGATION</text>
    <rect x="70" y="210" width="424" height="48" rx="8" fill="#25c7df"/>
    <text x="90" y="241" fill="#031017" font-size="19" font-weight="700">▶ ◆  Snapshot Center</text>
    <text x="90" y="290" fill="#d1e6ee" font-size="18">  ◇  Comparison Lab</text>
    <text x="90" y="338" fill="#d1e6ee" font-size="18">  ▶  Watch Session</text>
    <text x="90" y="386" fill="#d1e6ee" font-size="18">  ●  Live Monitor</text>
    <text x="90" y="434" fill="#d1e6ee" font-size="18">  ▤  Reports &amp; Bundles</text>
    <text x="90" y="482" fill="#d1e6ee" font-size="18">  ✓  Diagnostics</text>
    <text x="90" y="530" fill="#d1e6ee" font-size="18">  ⚙  Settings</text>
    <text x="90" y="578" fill="#d1e6ee" font-size="18">  i  About SysDiff</text>
    <text x="90" y="626" fill="#ef6475" font-size="18">  ×  Exit</text>

    <text x="558" y="190" fill="#2c9fb7" font-size="15">SYSTEM OVERVIEW</text>
    <text x="558" y="232" fill="#d1e6ee" font-size="17">Windows: 10.0.26100</text>
    <text x="558" y="270" fill="#d1e6ee" font-size="17">Architecture: x64</text>
    <text x="558" y="308" fill="#64df8b" font-size="17">Privileges: Administrator</text>
    <text x="558" y="346" fill="#d1e6ee" font-size="17">Storage: User profile</text>
    <text x="558" y="384" fill="#d1e6ee" font-size="17">Snapshots: 12</text>
    <text x="558" y="422" fill="#d1e6ee" font-size="17">Reports: 8</text>
    <text x="558" y="460" fill="#d1e6ee" font-size="17">Providers: 11</text>
    <text x="558" y="516" fill="#2c9fb7" font-size="15">DATA DIRECTORY</text>
    <text x="558" y="552" fill="#9bb4be" font-size="15">%LOCALAPPDATA%\SysDiff</text>
    <rect x="558" y="590" width="610" height="34" rx="6" fill="#0e2e3b"/>
    <text x="574" y="613" fill="#55e7ff" font-size="14">Ready · choose a module with ↑ / ↓ and press Enter</text>

    <line x1="62" y1="646" x2="1218" y2="646" stroke="#1b8499"/>
    <text x="640" y="686" fill="#78939f" font-size="14" text-anchor="middle">↑ ↓ NAVIGATE   ENTER OPEN   ESC BACK   F5 REFRESH   Q EXIT</text>
  </g>
</svg>
