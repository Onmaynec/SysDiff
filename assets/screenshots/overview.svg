<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="650" viewBox="0 0 1180 650" role="img" aria-labelledby="title">
  <title id="title">Пример консольного отчёта SysDiff</title>
  <rect width="1180" height="650" rx="22" fill="#071014"/>
  <rect x="24" y="24" width="1132" height="602" rx="14" fill="#0b171c" stroke="#1d3942" stroke-width="2"/>
  <circle cx="58" cy="56" r="7" fill="#ff5f6d"/><circle cx="82" cy="56" r="7" fill="#f3c969"/><circle cx="106" cy="56" r="7" fill="#8bd49c"/>
  <g font-family="Cascadia Mono,Consolas,monospace" font-size="22">
    <text x="54" y="110" fill="#40d9d0" font-weight="700">SYSDIFF · before → after</text>
    <text x="54" y="150" fill="#89a8b1">Добавлено: 183   Удалено: 21   Изменено: 64   Скрыто: 1 284</text>
    <text x="54" y="205" fill="#dceef3">[SERVICES]</text>
    <text x="75" y="245" fill="#ff9567">+ [HIGH] Example Update Service</text>
    <text x="98" y="280" fill="#89a8b1">Добавлена автоматически запускаемая служба Windows.</text>
    <text x="54" y="335" fill="#dceef3">[STARTUP]</text>
    <text x="75" y="375" fill="#ff5f6d">~ [CRITICAL] Winlogon Shell</text>
    <text x="98" y="410" fill="#89a8b1">Изменён чувствительный механизм входа пользователя.</text>
    <text x="54" y="465" fill="#dceef3">[ENVIRONMENT]</text>
    <text x="75" y="505" fill="#f3c969">+ [MEDIUM] PATH → C:\Program Files\Example\bin</text>
    <text x="98" y="540" fill="#89a8b1">Добавлен новый путь поиска исполняемых файлов.</text>
    <text x="54" y="594" fill="#52a8ff">Отчёт: reports\before-to-after.html</text>
  </g>
</svg>
