<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020805"/>
      <stop offset="1" stop-color="#07150f"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1440" height="900" rx="28" fill="#050807"/>
  <rect x="20" y="20" width="1400" height="860" rx="20" fill="url(#bg)" stroke="#22c55e" stroke-width="2"/>
  <g font-family="Consolas, Cascadia Mono, monospace">
    <text x="720" y="78" text-anchor="middle" fill="#38f28a" font-size="44" font-weight="700" filter="url(#glow)">SYSDIFF CYBER CONSOLE</text>
    <text x="720" y="112" text-anchor="middle" fill="#22d3ee" font-size="20">WINDOWS DRIFT INVESTIGATION NODE // BUILD 0.6.0</text>
    <line x1="48" y1="136" x2="1392" y2="136" stroke="#166534" stroke-width="2"/>
    <text x="62" y="172" fill="#4ade80" font-size="18">[ NODE:ONLINE ] [ ROOT:ADMIN ] [ OS:10.0.26100 ] [ ARCH:X64 ]</text>
    <text x="62" y="204" fill="#22d3ee" font-size="18">[ SNAPSHOTS:12 ] [ REPORTS:8 ] [ PROVIDERS:11 ] [ STORAGE:PROFILE ]</text>
    <text x="62" y="236" fill="#9ca3af" font-size="18">DRIFT CHANNEL &gt; BASELINE:trusted-clean // CASE:Installer audit // RISK:027/100</text>
    <line x1="48" y1="258" x2="1392" y2="258" stroke="#166534" stroke-width="2"/>
    <text x="720" y="294" text-anchor="middle" fill="#38f28a" font-size="20" font-weight="700">COMMAND DECK // SELECT MODULE</text>
    <g font-size="19">
      <text x="72" y="338" fill="#d1d5db">  [01] ◆ Snapshot Node          // создание, просмотр и перенос снимков</text>
      <text x="72" y="382" fill="#d1d5db">  [02] ◇ Diff Lab               // сравнение и исследование изменений</text>
      <rect x="54" y="402" width="1332" height="42" rx="4" fill="#22c55e"/>
      <text x="72" y="431" fill="#03130a" font-weight="700">▶ [03] ⌁ Drift Operations       // baseline, risk score и drift scan                    [ARMED]</text>
      <text x="72" y="474" fill="#d1d5db">  [04] ◷ Investigation Timeline // единая хронология расследования</text>
      <text x="72" y="518" fill="#d1d5db">  [05] ▣ Case Vault             // кейсы, заметки и связанные объекты</text>
      <text x="72" y="562" fill="#d1d5db">  [06] ▶ Watch Operations       // контролируемый запуск программы</text>
      <text x="72" y="606" fill="#d1d5db">  [07] ● Live Signal            // процессы и сетевые endpoints</text>
      <text x="72" y="650" fill="#d1d5db">  [08] ▤ Report Vault           // готовые отчёты и архивы</text>
      <text x="72" y="694" fill="#d1d5db">  [09] ⚙ System Node            // diagnostics, settings, about, disconnect</text>
    </g>
    <line x1="48" y1="724" x2="1392" y2="724" stroke="#166534" stroke-width="2"/>
    <text x="720" y="762" text-anchor="middle" fill="#22d3ee" font-size="18">QUICK OPS &gt; 1-9 MODULES · P SNAPSHOT · C DIFF · G DRIFT · T TIMELINE · K CASES · D SYSTEM</text>
    <text x="720" y="798" text-anchor="middle" fill="#6b7280" font-size="17">NAV &gt; ↑↓ MOVE · ENTER EXECUTE · ESC BACK · F5 RESCAN · Q DISCONNECT</text>
    <text x="720" y="848" text-anchor="middle" fill="#fbbf24" font-size="15">SysDiff фиксирует изменения и объясняет дрейф, но не является антивирусом.</text>
  </g>
</svg>
