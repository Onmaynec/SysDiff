<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" role="img" aria-labelledby="title desc">
  <title id="title">SysDiff 0.7.0 Release Channel</title>
  <desc id="desc">Cyber Console Update Center with stable release, SHA-256 verification and rollback-safe installation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030906"/>
      <stop offset="0.55" stop-color="#07140d"/>
      <stop offset="1" stop-color="#020604"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#123c25" stroke-width="1" opacity=".22"/>
    </pattern>
  </defs>
  <rect width="1500" height="860" rx="24" fill="url(#bg)"/>
  <rect width="1500" height="860" rx="24" fill="url(#grid)"/>
  <rect x="35" y="35" width="1430" height="790" rx="18" fill="none" stroke="#22c55e" stroke-width="2" opacity=".7"/>
  <rect x="52" y="52" width="1396" height="92" rx="12" fill="#06150c" stroke="#15803d"/>
  <text x="750" y="94" text-anchor="middle" font-family="Consolas,monospace" font-size="42" font-weight="700" fill="#39ff88" filter="url(#glow)">SYSDIFF CYBER CONSOLE</text>
  <text x="750" y="124" text-anchor="middle" font-family="Consolas,monospace" font-size="18" fill="#38bdf8">WINDOWS RELEASE &amp; DRIFT CONTROL NODE // BUILD 0.7.0</text>

  <g font-family="Consolas,monospace">
    <rect x="70" y="172" width="1360" height="64" rx="10" fill="#071c10" stroke="#166534"/>
    <text x="95" y="200" font-size="18" fill="#22c55e">[ NODE:ONLINE ] [ ROOT:ADMIN ] [ CHANNEL:STABLE ] [ NETWORK:READY ]</text>
    <text x="95" y="224" font-size="17" fill="#67e8f9">CURRENT: 0.7.0   LATEST: 0.7.0   STATUS: CURRENT   AUTO-CHECK: ON / 24H</text>

    <rect x="70" y="260" width="565" height="500" rx="12" fill="#041009" stroke="#14532d"/>
    <text x="352" y="300" text-anchor="middle" font-size="20" fill="#39ff88">SYSTEM NODE // UPDATE CENTER</text>
    <line x1="90" y1="320" x2="615" y2="320" stroke="#166534"/>

    <g font-size="18">
      <rect x="92" y="344" width="520" height="50" rx="6" fill="#22c55e"/>
      <text x="112" y="376" fill="#020604">▶ [01] ⌕ CHECK STABLE CHANNEL          [ARMED]</text>
      <text x="112" y="432" fill="#d1fae5">  [02] ⇩ DOWNLOAD VERIFIED UPDATE       [READY]</text>
      <text x="112" y="482" fill="#d1fae5">  [03] ⇧ INSTALL DOWNLOADED              [READY]</text>
      <text x="112" y="532" fill="#d1fae5">  [04] ⚙ UPDATE SETTINGS                 [READY]</text>
      <text x="112" y="582" fill="#d1fae5">  [05] × CLEAR UPDATE CACHE              [READY]</text>
      <text x="112" y="632" fill="#d1fae5">  [06] ← BACK                            [READY]</text>
    </g>

    <line x1="90" y1="670" x2="615" y2="670" stroke="#166534"/>
    <text x="112" y="704" font-size="16" fill="#67e8f9">AUTO-DOWNLOAD: OFF</text>
    <text x="112" y="731" font-size="16" fill="#94a3b8">INSTALL REQUIRES CONFIRMATION</text>

    <rect x="665" y="260" width="765" height="500" rx="12" fill="#041009" stroke="#14532d"/>
    <text x="1047" y="300" text-anchor="middle" font-size="20" fill="#39ff88">VERIFIED UPDATE PIPELINE</text>
    <line x1="685" y1="320" x2="1410" y2="320" stroke="#166534"/>

    <g font-size="18">
      <text x="700" y="365" fill="#22c55e">[OK] OFFICIAL GITHUB HOST</text>
      <text x="700" y="405" fill="#22c55e">[OK] TAG v0.7.0 ↔ VERSION 0.7.0</text>
      <text x="700" y="445" fill="#22c55e">[OK] RUNTIME win-x64</text>
      <text x="700" y="485" fill="#22c55e">[OK] SIZE 87.4 MB / LIMIT 512 MB</text>
      <text x="700" y="525" fill="#22c55e">[OK] SHA-256 VERIFIED</text>
      <text x="700" y="565" fill="#38bdf8">[>>] STAGED EXE VERSION CHECK</text>
      <text x="700" y="605" fill="#94a3b8">[--] WAIT USER CONFIRMATION</text>
      <text x="700" y="645" fill="#94a3b8">[--] BACKUP → REPLACE → VERIFY</text>
      <text x="700" y="685" fill="#fbbf24">[!!] AUTHENTICODE: UNSIGNED</text>
      <text x="700" y="725" fill="#67e8f9">ROLLBACK SAFE // USER DATA PRESERVED</text>
    </g>
  </g>
  <text x="750" y="802" text-anchor="middle" font-family="Consolas,monospace" font-size="16" fill="#64748b">↑↓ MOVE · ENTER EXECUTE · ESC BACK · Q DISCONNECT</text>
</svg>
